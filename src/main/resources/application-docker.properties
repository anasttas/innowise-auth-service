spring.application.name=auth-service

spring.config.import=optional:file:.env.docker[.properties]

server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.jpa.hibernate.ddl-auto=none

jwt.secret.access=${JWT_ACCESS_SECRET}
jwt.secret.refresh=${JWT_REFRESH_SECRET}

security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

user.service.url=${USER_SERVICE_URL}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true