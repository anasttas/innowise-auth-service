databaseChangeLog:

  - changeSet:
      id: create-credentials-table
      author: Kharlamova

      changes:
        - sql:
            splitStatements: true
            endDelimiter: ;

            sql: |
              CREATE TABLE credentials (
                  id SERIAL PRIMARY KEY,
                  user_id BIGINT NOT NULL UNIQUE,
                  login VARCHAR(20) NOT NULL UNIQUE,
                  password VARCHAR(255) NOT NULL,
                  role VARCHAR(20)
              );